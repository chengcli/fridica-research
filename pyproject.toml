[build-system]
requires = ["setuptools>=77"]  # PEP 639: the SPDX `license` string and `license-files`
build-backend = "setuptools.build_meta"

[project]
name = "fridica-research"
version = "0.1.0.dev0"
description = "The auto-research stage machine and driver for fridica (chengcli/fridica#126)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
fridica-research = "fridica_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fridica_research = ["schemas/*.json", "roles/*.md", "roles/lenses/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 340
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702"]
